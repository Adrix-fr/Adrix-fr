name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF4A2D&color_dots=#ebedf0,#ffd6cf,#ff9e8c,#ff6a50,#d93a1f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4A2D&color_dots=#161b22,#4a1a12,#8a2a1a,#c93a22,#FF4A2D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
